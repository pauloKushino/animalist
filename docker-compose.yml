services:
  postgres:
    image: postgres:17-alpine
    container_name: animalist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: animalist
      POSTGRES_PASSWORD: animalist
      POSTGRES_DB: animalist
    ports:
      # 5432 já está em uso nesta máquina
      - "5434:5432"
    volumes:
      - animalist-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animalist -d animalist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  animalist-pgdata:
